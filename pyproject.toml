[project]
name = "pyqreg2"
version = "0.5.1"
description = "Maintained fork of pyqreg: fast quantile regression with support for iid, robust, and cluster standard errors."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jay Kim", email = "mozjay0619@gmail.com" }]
maintainers = [{ name = "mvds314" }]
requires-python = ">=3.11"
keywords = [
  "quantile regression",
  "statistics",
  "econometrics",
  "cluster standard errors",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "patsy>=0.5.3",
]

[project.urls]
Homepage = "https://github.com/mvds314/pyqreg"
Source = "https://github.com/mvds314/pyqreg"
Issues = "https://github.com/mvds314/pyqreg/issues"
"Upstream project" = "https://github.com/mozjay0619/pyqreg"

[project.optional-dependencies]
test = ["pytest", "pytest-cython", "statsmodels"]
dev = [
  "twine",
  "coverage",
  "pytest",
  "pytest-cython",
  "statsmodels",
  "numpy",
  "pandas",
  "scipy",
  "cython",
  "patsy",
]

[build-system]
requires = [
  "setuptools>=77",
  "wheel",
  "numpy>=2.0",
  "scipy>=1.11",
  "cython>=3.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
# Cython sources are not Python and cannot be parsed by ruff.
extend-exclude = ["build"]

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set changes between releases, which
# would otherwise turn CI red without any change to this repository.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "TRY", "PLR0402"]
# TRY003 forbids long messages outside exception classes, which would mean
# inventing an exception type per validation message.
ignore = ["TRY003"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
# scipy is both a build and a runtime requirement, and publishes no i686 or
# win32 wheels. musllinux and win_arm64 are skipped only to keep release
# builds short; scipy supports both, so they can be enabled later.
skip = "*-musllinux_* *_i686 *-win32 *-win_arm64"
build-frontend = "build"
# statsmodels is the reference implementation the covariance estimators were
# ported from, and the tests use it as an independent oracle, so the wheel test
# environment needs it too. Without it pytest fails collection with exit code 2.
test-requires = "pytest statsmodels"
test-command = "pytest {project}/tests"
